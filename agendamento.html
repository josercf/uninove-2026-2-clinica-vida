<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida+</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>

    <header>
        <h1>Clínica Vida+</h1>
        <p>Agendamento de consultas em seis especialidades.</p>

        <nav class="menu">
            <ul>
                <li><a href="index.html#apresentacao">A Clínica</a></li>
                <li><a href="index.html#especialidades">Especialidades</a></li>
                <li><a href="index.html#corpo-clinico">Corpo clínico</a></li>
                <li><a class="menu-link" href="agendamento.html">Agendar Consulta</a></li>
            </ul>
        </nav>
    </header> 

    <main>
        <h2>Formulário de Agendamento</h2>

        <form class="form-agendamento" action="/agendamento" method="post">
            
            <fieldset>
                <legend>Dados do paciente</legend>
                
                <div class="form-grid">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" minlength="5" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" required
                               placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" max="2026-09-08" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="nome@email.com" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados da consulta</legend>
                
                <div class="form-grid">
                    
                    <div class="campo">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade" name="especialidade" required>
                            <option value="">Selecione</option>
                            <option value="cardiologia">Cardiologia</option>
                            <option value="pediatria">Pediatria</option>
                            <option value="dermatologia">Dermatologia</option>
                            <option value="ginecologia">Ginecologia</option>
                            <option value="ortopedia">Ortopedia</option>
                            <option value="clinica-geral">Clínica Geral</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="medico">Médico</label>
                        <select id="medico" name="medico" required>
                            <option value="">Selecione</option>
                            <option value="ana-prado">Ana Prado (Cardiologia)</option>
                            <option value="carlos-mendes">Carlos Mendes (Pediatria)</option>
                            <option value="mariana-silva">Mariana Silva (Dermatologia)</option>
                            <option value="beatriz-costa">Beatriz Costa (Ginecologia)</option>
                            <option value="ricardo-souza">Ricardo Souza (Ortopedia)</option>
                            <option value="fernando-alves">Fernando Alves (Clínica Geral)</option>
                        </select>
                    </div>
                    
                    <div class="campo">
                        <label for="data-consulta">Data</label>
                        <input type="date" id="data-consulta" name="data-consulta" min="2026-09-08" required>
                    </div>

                    <div class="campo">
                        <label for="horario">Horário</label>
                        <input type="time" id="horario" name="horario" required>
                    </div>

                    <div class="campo campo-largo">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" rows="3" maxlength="300"></textarea>
                    </div>

                </div>
            </fieldset>

            <div class="campo-botao">
                <button type="submit">Enviar Agendamento</button>
            </div>
            
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Clínica Vida+. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
