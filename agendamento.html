<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar consulta - Clínica Vida+</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
    <header>
        <h1>Clínica Vida+</h1>
        <p>Agendamento de consultas em seis especialidades.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html#apresentacao">A clínica</a></li>
            <li><a href="index.html#especialidades">Especialidades</a></li>
            <li><a href="index.html#corpo-clinico">Corpo clínico</a></li>
            <li><a href="agendamento.html">Agendar consulta</a></li>
        </ul>
    </nav>

    <main>
        <h2>Agendar consulta</h2>
        <form class="form-agendamento" action="/agendamento" method="post">
    <fieldset>
        <legend>Dados do paciente</legend>

        <div class="form-grid">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" minlength="5" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf"
                       placeholder="000.000.000-00"
                       pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
            </div>
            <div class="campo">
    <label for="nascimento">Data de nascimento</label>
    <input type="date" id="nascimento" name="nascimento" required>
</div>

<div class="campo">
    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" required>
</div>

<div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>
</div>
        </div>
    </fieldset>
    <fieldset>
    <legend>Dados da consulta</legend>

    <div class="form-grid">
        <div class="campo">
            <label for="especialidade">Especialidade</label>
            <select id="especialidade" name="especialidade" required>
                <option value="">Selecione</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
        </div>

        <div class="campo campo-largo">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="3" maxlength="300"></textarea>
        </div>
    </div>
</fieldset>
</fieldset>

<button type="submit">Agendar consulta</button>

</form>

    </main>

    <footer>
        <p>Rua das Acácias, 120, São Paulo. Telefone: (11) 4002-8922</p>
    </footer>
</body>
</html>
