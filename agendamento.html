<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Vida+ | Agendamento</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/agendamento.js" defer></script>
</head>
<body>
  <header>
    <h1>Clínica Vida+</h1>
    <p>Agendamento de consultas em oito especialidades.</p>
    <nav>
      <ul>
        <li><a href="index.html#clinica">A clínica</a></li>
        <li><a href="index.html#especialidades">Especialidades</a></li>
        <li><a href="index.html#corpo-clinico">Corpo clínico</a></li>
        <li><a href="#agendamento.html">Agendar consulta</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <form id="form-agendamento" class="form-agendamento" action="/agendamento" method="post">
  <fieldset>
    <legend>Dados do paciente</legend>
    <div class="form-grid">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" minlength="5" required>
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf"
               placeholder="000.000.000-00"
               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
               <span class="aviso" id="aviso-cpf"></span>
      </div>
      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>
  </fieldset>
      <fieldset>
    <legend>Dados da consulta</legend>
    <div class="form-grid">
      <div class="campo">
        <label for="especialidade">Especialidade</label>
        <select id="especialidade" name="especialidade" required>
          <option value="">Selecione</option>
          <option value="cardiologia">Cardiologia</option>
          <option value="pediatria">Pediatria</option>
          <option value="dermatologia">Dermatologia</option>
          <option value="ginecologia e obstetrícia">Ginecologia e Obstetrícia</option>
          <option value="ortopedia">Ortopedia</option>
          <option valeu="clinica geral">Clínica Geral</option>
          <option valeu="nutrição">Nutrição</option>
          <option valeu="psicologia">Psicologia</option>
        </select>
      </div>
      <div class="campo">
        <label for="medico">Médico</label>
        <select id="medico" name="medico" required>
          <option value="">Selecione</option>
          <option value="cardiologia">Ana Prado</option>
          <option value="pediatria">Carlos Eduardo Silva</option>
          <option value="dermatologia">Mariana Costa Menezes</option>
          <option value="ginecologia e obstetrícia">Ricardo Alves Santos</option>
          <option value="ortopedia">Juliana Rocha Ribeiro</option>
          <option value="clínica geral">Roberto Almeida Castro</option>
          <option value="nutrição">Fernanda Souza Lima</option>
          <option value="psicologia">Bruno Mendes Oliveira</option>
        </select>
      </div>
      <div class="campo">
        <label for="data">Data da consulta</label>
        <input type="date" id="data" name="data" min="2026-09-01" required>
        <span class="aviso" id="aviso-data"></span>
      </div>
      <div class="campo">
        <label for="horario">Horário</label>
        <input type="time" id="horario" name="horario" min="08:00" max="18:00" required>
        <span class="aviso" id="aviso-horario"></span>
      </div>
      <div class="campo campo-largo">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="3" maxlength="300"></textarea>
      </div>
    </div>
  </fieldset>

  <button type="submit">Agendar consulta</button>
  <p id="resumo-agendamento" class="oculto"></p>
</form>
  </main>
  <footer>
  <p>Rua das Acácias, 120, São Paulo. Telefone: (11) 4002-8922</p>
</footer>
</body>
</html>
