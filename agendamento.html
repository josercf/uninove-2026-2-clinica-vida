
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="agendamento.css">

    <script src="assets/js/agendamento.js" defer></script>

    <title>Agendar consulta | Clínica Vida+</title>
</head>
<body>
    <header>
        <h1>Clínica Vida+</h1>
        <p>Agendamento de consultas em seis especialidades.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="agendamento.html">Agendar consulta</a></li>
        </ul>
    </nav>

    <main>
        <h2>Agendamento de consulta</h2>

        <form id="form-agendamento"
              class="form-agendamento"
              action="#"
              method="post">

            <fieldset>
                <legend>Dados do paciente</legend>

                <div class="form-grid">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text"
                               id="nome"
                               name="nome"
                               minlength="5"
                               required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text"
                               id="cpf"
                               name="cpf"
                               placeholder="000.000.000-00"
                               inputmode="numeric"
                               required>
                        <span class="aviso" id="aviso-cpf"></span>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date"
                               id="nascimento"
                               name="nascimento"
                               required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel"
                               id="telefone"
                               name="telefone"
                               placeholder="(11) 99999-9999"
                               required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email"
                               id="email"
                               name="email"
                               required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados da consulta</legend>

                <div class="form-grid">
                    <div class="campo">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade"
                                name="especialidade"
                                required>
                            <option value="">Selecione</option>
                            <option value="Cardiologia">Cardiologia</option>
                            <option value="Pediatria">Pediatria</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="medico">Médico</label>
                        <select id="medico" name="medico" required>
                            <option value="">Selecione</option>
                            <option value="Dr. João">Dr. João</option>
                            <option value="Dra. Maria">Dra. Maria</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data">Data da consulta</label>
                        <input type="date"
                               id="data"
                               name="data"
                               required>
                        <span class="aviso" id="aviso-data"></span>
                    </div>

                    <div class="campo">
                        <label for="horario">Horário</label>
                        <input type="time"
                               id="horario"
                               name="horario"
                               required>
                        <span class="aviso" id="aviso-horario"></span>
                    </div>

                    <div class="campo campo-largo">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes"
                                  name="observacoes"
                                  rows="3"
                                  maxlength="300"></textarea>
                    </div>
                </div>
            </fieldset>

            <button type="submit">Agendar consulta</button>

            <p id="resumo-agendamento"
               class="oculto"
               aria-live="polite"></p>
        </form>
    </main>

    <footer>
        <p>
            Rua das Acácias, 120, São Paulo.
            Telefone: (11) 4002-8922
        </p>
    </footer>
</body>
</html>
